<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إنشاء متجر جديد - ClickShop</title>
    <style>
        body {
            font-family: Tahoma, Arial, sans-serif;
            background-color: #f3f4f6;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            background: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
            width: 100%;
            max-width: 450px;
        }
        h2 {
            text-align: center;
            color: #065f46;
            margin-bottom: 25px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            color: #374151;
            font-weight: 600;
        }
        input, select {
            width: 100%;
            padding: 12px;
            border: 2px solid #e5e7eb;
            border-radius: 8px;
            box-sizing: border-box;
            outline: none;
            font-size: 14px;
            transition: border-color 0.3s;
        }
        input:focus, select:focus {
            border-color: #047857;
        }
        .btn-submit {
            background-color: #047857;
            color: white;
            border: none;
            padding: 12px;
            width: 100%;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        .btn-submit:hover {
            background-color: #065f46;
        }
        .activation-timer-box {
            background: #f0fdf4;
            border: 1px solid #047857;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            text-align: center;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>بيانات متجرك الجديد</h2>

    <!-- عداد التنازلي للتفعيل -->
    <div class="activation-timer-box">
        <span style="font-size: 14px; color: #065f46; font-weight: bold;">الوقت المتبقي لإدخال كود التفعيل:</span>
        <div id="countdown" style="font-size: 20px; color: #dc2626; font-weight: bold; margin-top: 5px;">10:00</div>
    </div>

    <form action="/register" method="POST">
        
        <!-- خانة كود التفعيل -->
        <div class="form-group">
            <label for="activationCode">كود التفعيل</label>
            <input type="text" id="activationCode" name="activationCode" placeholder="أدخل كود التفعيل هنا" required style="border: 2px solid #047857;">
        </div>

        <div class="form-group">
            <label for="storeName">اسم المتجر (مثال: ZASO Store)</label>
            <input type="text" id="storeName" name="storeName" placeholder="أدخل اسم متجرك" required>
        </div>

        <div class="form-group">
            <label for="storeSlug">رابط المتجر بالإنجليزية (مثال: zaso)</label>
            <input type="text" id="storeSlug" name="storeSlug" placeholder="store-name" required>
        </div>

        <div class="form-group">
            <label for="storeCategory">مجال التجارة</label>
            <select id="storeCategory" name="storeCategory">
                <option value="clothing">ملابس وأزياء</option>
                <option value="electronics">إلكترونيات</option>
                <option value="general">تجارة عامة</option>
            </select>
        </div>

        <div class="form-group">
            <label for="ownerName">اسم صاحب المتجر</label>
            <input type="text" id="ownerName" name="ownerName" placeholder="الاسم الكامل" required>
        </div>

        <div class="form-group">
            <label for="password">كلمة المرور لوحة التحكم</label>
            <input type="password" id="password" name="password" placeholder="********" required>
        </div>

        <button type="submit" class="btn-submit">إنشاء المتجر</button>
    </form>
</div>

<!-- سكربت العداد التنازلي -->
<script>
let timeLeft = 600; // 10 دقائق
const countdownElement = document.getElementById('countdown');

const timer = setInterval(() => {
    let minutes = Math.floor(timeLeft / 60);
    let seconds = timeLeft % 60;

    minutes = minutes < 10 ? '0' + minutes : minutes;
    seconds = seconds < 10 ? '0' + seconds : seconds;

    countdownElement.textContent = minutes + ':' + seconds;

    if (timeLeft <= 0) {
        clearInterval(timer);
        countdownElement.textContent = "انتهى الوقت!";
    } else {
        timeLeft--;
    }
}, 1000);
</script>

</body>
</html>
