<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ClickShop</title>
    <!-- استدعاء مكتبة أيقونات FontAwesome للواتساب والسوشيال ميديا -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Tahoma', sans-serif; }
        body { background: #f3f4f6; color: #1f2937; text-align: center; }
        
        /* الهيدر الجديد: شعار + صورة بجانبه */
        header { background: #008060; color: white; padding: 25px 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); display: flex; align-items: center; justify-content: center; gap: 15px; }
        .logo-img { width: 50px; height: 50px; border-radius: 50%; object-fit: cover; border: 2px solid white; }
        header h1 { font-size: 28px; font-weight: bold; }

        .container { max-width: 800px; margin: 30px auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        
        .hero-title { font-size: 22px; color: #111827; margin-bottom: 15px; font-weight: bold; }
        .hero-desc { font-size: 15px; color: #4b5563; line-height: 1.8; margin-bottom: 25px; }

        .btn { background: #008060; color: white; border: none; padding: 14px 25px; font-size: 16px; font-weight: bold; border-radius: 8px; cursor: pointer; text-decoration: none; display: inline-block; transition: background 0.3s; }
        .btn:hover { background: #006e52; }

        /* مكان الإعلانات */
        .ads-banner { background: #fef3c7; border: 2px dashed #f59e0b; padding: 20px; border-radius: 8px; margin-bottom: 25px; color: #92400e; font-weight: bold; }

        /* قسم وسائل التواصل الاجتماعي والواتساب */
        .social-box { margin-top: 30px; padding-top: 20px; border-top: 1px solid #e5e7eb; display: flex; justify-content: center; gap: 20px; }
        .social-btn { display: flex; align-items: center; justify-content: center; width: 45px; height: 45px; border-radius: 50%; color: white; font-size: 20px; text-decoration: none; transition: transform 0.2s; }
        .social-btn:hover { transform: scale(1.1); }
        .whatsapp { background: #25d366; }
        .instagram { background: #e1306c; }
        .facebook { background: #1877f2; }
        .telegram { background: #0088cc; }

        /* نموذج التسجيل */
        #registerSection { display: none; margin-top: 25px; text-align: right; border-top: 2px solid #e5e7eb; padding-top: 25px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 6px; font-weight: bold; color: #374151; font-size: 14px; }
        input, select { width: 100%; padding: 10px; border: 1px solid #d1d5db; border-radius: 6px; font-size: 14px; }
        
        .timer-box { background: #f0fdf4; border: 1px dashed #008060; padding: 12px; border-radius: 6px; margin-bottom: 15px; text-align: center; }
        .timer { font-size: 20px; color: #dc2626; font-weight: bold; }
    </style>
</head>
<body>

    <!-- الهيدر: صورة + ClickShop فقط -->
    <header>
        <img src="https://i.ibb.co/6P82W8h/default-avatar.png" alt="Logo" class="logo-img" id="shopLogo">
        <h1>ClickShop</h1>
    </header>

    <div class="container">
        <!-- مكان الإعلانات (يمكنك تغيير محتواه لاحقاً) -->
        <div class="ads-banner">
            📢 مساحة إعلانية مخصصة (عروض وخصومات مميزة قريباً هنا)
        </div>

        <!-- الصفحة الترحيبية -->
        <div id="homePage">
            <h2 class="hero-title">أنشئ متجرك الإلكتروني الاحترافي في ثوانٍ</h2>
            <p class="hero-desc">
                منصة متكاملة لإطلاق تجارتك الذكية، بتحكم كامل في الهوية، الألوان، وبأمان تام عبر أكواد التفعيل الحصرية.
            </p>
            <button class="btn" onclick="showRegisterForm()">ابدأ إنشاء متجرك الآن 🚀</button>
        </div>

        <!-- واجهة التسجيل -->
        <div id="registerSection">
            <h3 style="text-align: center; color: #008060; margin-bottom: 15px;">نموذج تسجيل المتجر الجديد</h3>
            
            <div class="timer-box">
                <p>الوقت المتبقي لإدخال كود التفعيل:</p>
                <div class="timer" id="countdown">01:15</div>
            </div>

            <form action="/register" method="POST">
                <div class="form-group">
                    <label>كود التفعيل:</label>
                    <input type="text" name="activationCode" placeholder="مثال: CS-9X4F-7B2K" required>
                </div>

                <div class="form-group">
                    <label>اسم المتجر:</label>
                    <input type="text" name="storeName" placeholder="أدخل اسم متجرك" required>
                </div>

                <div class="form-group">
                    <label>رابط المتجر بالإنجليزية (Slug):</label>
                    <input type="text" name="storeSlug" placeholder="store-name" required>
                </div>

                <div class="form-group">
                    <label>مجال التجارة:</label>
                    <select name="storeCategory">
                        <option>ملابس وأزياء</option>
                        <option>إلكترونيات وتكنولوجيا</option>
                        <option>مستحضرات تجميل وعناية</option>
                        <option>أغذية ومواد عامة</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>لون الهوية البصرية:</label>
                    <select name="storeColor">
                        <option>أخضر زمردي / Emerald Green</option>
                        <option>أسود ملكي / Royal Black</option>
                        <option>أزرق داكن / Navy Blue</option>
                        <option>أحمر جريء / Bold Red</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>اسم صاحب المتجر:</label>
                    <input type="text" name="ownerName" placeholder="اسمك الكامل" required>
                </div>

                <div class="form-group">
                    <label>كلمة مرور لوحة تحكم متجرك:</label>
                    <input type="password" name="password" placeholder="كلمة المرور الخاصة بمتجرك" required>
                </div>

                <button type="submit" class="btn" style="width: 100%;">إتمام وإنشاء المتجر 🎯</button>
            </form>
        </div>

        <!-- قسم مواقع التواصل الاجتماعي والواتساب بأيقونات احترافية -->
        <div class="social-box">
            <a href="https://wa.me/213000000000" target="_blank" class="social-btn whatsapp" title="تواصل عبر الواتساب"><i class="fa-brands fa-whatsapp"></i></a>
            <a href="https://instagram.com" target="_blank" class="social-btn instagram" title="إنستغرام"><i class="fa-brands fa-instagram"></i></a>
            <a href="https://facebook.com" target="_blank" class="social-btn facebook" title="فيسبوك"><i class="fa-brands fa-facebook-f"></i></a>
            <a href="https://t.me" target="_blank" class="social-btn telegram" title="تلغرام"><i class="fa-brands fa-telegram"></i></a>
        </div>
    </div>

    <script>
        function showRegisterForm() {
            document.getElementById('homePage').style.display = 'none';
            document.getElementById('registerSection').style.display = 'block';
        }

        // عداد الوقت التنازلي
        let timeLeft = 75;
        const timerElement = document.getElementById('countdown');
        const timerInterval = setInterval(() => {
            if (timeLeft <= 0) {
                clearInterval(timerInterval);
                timerElement.innerText = "انتهى الوقت!";
            } else {
                let minutes = Math.floor(timeLeft / 60);
                let seconds = timeLeft % 60;
                timerElement.innerText = `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
                timeLeft--;
            }
        }, 1000);
    </script>
</body>
</html>
