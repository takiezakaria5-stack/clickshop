<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة تحكم التاجر | ClickShop</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, sans-serif; }
        body { background: #f6f6f7; color: #202223; padding: 20px; }
        .box { max-width: 500px; margin: 30px auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 5px 20px rgba(0,0,0,0.06); position: relative; z-index: 10; }
        h2 { color: #004c3f; margin-bottom: 20px; text-align: center; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: 600; font-size: 14px; }
        input, textarea { width: 100%; padding: 12px; border: 1px solid #babfc3; border-radius: 6px; font-size: 15px; background: #fff; }
        input:focus, textarea:focus { outline: none; border-color: #008060; box-shadow: 0 0 0 2px rgba(0,128,96,0.1); }
        button { width: 100%; background: #008060; color: white; padding: 14px; border: none; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        button:hover { background: #006e52; }
        .alert { margin-top: 15px; padding: 12px; border-radius: 6px; text-align: center; display: none; font-weight: bold; }
        .success { background: #e3f1df; color: #004c3f; }
        .error { background: #fbeae5; color: #d82c0d; }
        .store-link { display: block; text-align: center; margin-top: 15px; color: #008060; font-weight: bold; text-decoration: none; }
    </style>
</head>
<body>

    <!-- قسم تسجيل الدخول -->
    <div class="box" id="loginBox">
        <h2>دخول لوحة تحكم المتجر</h2>
        <form id="loginForm">
            <div class="form-group">
                <label>رابط المتجر (مثال: zexpress)</label>
                <input type="text" id="loginSlug" required placeholder="domain-slug" autocomplete="off">
            </div>
            <div class="form-group">
                <label>كلمة المرور</label>
                <input type="password" id="loginPassword" required placeholder="********">
            </div>
            <button type="submit">دخول</button>
        </form>
        <div id="loginAlert" class="alert"></div>
    </div>

    <!-- قسم إدارة المتجر وإضافة المنتجات -->
    <div class="box" id="dashboardBox" style="display: none;">
        <h2 id="welcomeTitle">إدارة المتجر</h2>
        <form id="addProductForm">
            <div class="form-group">
                <label>اسم المنتج</label>
                <input type="text" id="prodTitle" required placeholder="مثال: ساعة يد كلاسيكية">
            </div>
            <div class="form-group">
                <label>السعر (د.ج)</label>
                <input type="number" id="prodPrice" required placeholder="3500">
            </div>
            <div class="form-group">
                <label>رابط صورة المنتج (اختياري)</label>
                <input type="url" id="prodImage" placeholder="https://example.com/image.jpg">
            </div>
            <div class="form-group">
                <label>وصف مختصر للمنتج</label>
                <textarea id="prodDesc" rows="3" placeholder="اكتب مواصفات المنتج هنا..."></textarea>
            </div>
            <button type="submit">إضافة المنتج للمتجر</button>
        </form>
        <div id="prodAlert" class="alert"></div>
        <a id="visitStoreLink" href="#" target="_blank" class="store-link">معاينة المتجر مباشرة ↗</a>
    </div>

    <script>
        let currentStoreSlug = '';

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const alertBox = document.getElementById('loginAlert');
            const domainSlug = document.getElementById('loginSlug').value;
            const password = document.getElementById('loginPassword').value;

            try {
                const res = await fetch('/api/merchant/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ domainSlug, password })
                });
                const data = await res.json();

                if (res.ok) {
                    currentStoreSlug = data.store.domainSlug;
                    document.getElementById('loginBox').style.display = 'none';
                    document.getElementById('dashboardBox').style.display = 'block';
                    document.getElementById('welcomeTitle').textContent = `لوحة تحكم: ${data.store.storeName}`;
                    document.getElementById('visitStoreLink').href = `/store/${currentStoreSlug}`;
                } else {
                    alertBox.className = 'alert error';
                    alertBox.textContent = data.error || 'خطأ في البيانات';
                    alertBox.style.display = 'block';
                }
            } catch (err) {
                alertBox.className = 'alert error';
                alertBox.textContent = 'تعذر الاتصال بالسيرفر';
                alertBox.style.display = 'block';
            }
        });

        document.getElementById('addProductForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const alertBox = document.getElementById('prodAlert');
            
            const productData = {
                storeSlug: currentStoreSlug,
                title: document.getElementById('prodTitle').value,
                price: Number(document.getElementById('prodPrice').value),
                imageUrl: document.getElementById('prodImage').value,
                description: document.getElementById('prodDesc').value
            };

            try {
                const res = await fetch('/api/products/add', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(productData)
                });
                const data = await res.json();

                if (res.ok) {
                    alertBox.className = 'alert success';
                    alertBox.textContent = 'تم نشر المنتج في متجرك بنجاح!';
                    alertBox.style.display = 'block';
                    document.getElementById('addProductForm').reset();
                } else {
                    alertBox.className = 'alert error';
                    alertBox.textContent = data.error || 'خطأ في إضافة المنتج';
                    alertBox.style.display = 'block';
                }
            } catch (err) {
                alertBox.className = 'alert error';
                alertBox.textContent = 'تعذر الاتصال بالسيرفر';
                alertBox.style.display = 'block';
            }
        });
    </script>
</body>
</html>
